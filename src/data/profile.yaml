# Short intro used on the home page and the about page.
intro: >-
  I am an electrical engineer working on learning-based control for energy systems under uncertainty
  and for field robots. I build the simulators, compare deep RL with model predictive control and
  rule-based baselines, and report where the learned controllers fail.

bio:
  - >-
    My energy work covers microgrids with hydrogen storage, vehicle-to-grid and virtual power plants.
    For my MSc thesis at NTNU I modelled a port microgrid and compared DQN, PPO, MPC and an LSTM trained
    to imitate MPC. Before that I co-authored papers on deep-RL energy management for homes and V2G
    microgrids and on load frequency control, two of them in Applied Energy.
  - >-
    At TalTech I work on trustworthy AI for field robots. I lead the development of GCAST, a transformer
    that estimates rover wheel slip and gives each estimate a prediction interval that we check for
    coverage. A deep-RL traction and locomotion controller for the project rovers is in progress.
  - >-
    Earlier I was a lab engineer at the UMT Smart Power Systems Lab, where I worked on PV and battery
    energy management with hardware-in-the-loop tests, and a solar PV design and commissioning engineer.

interests:
  - Multi-agent RL for distributed energy resources
  - Learning-based MPC
  - Trustworthy and safe RL
  - Sim-to-real robot locomotion

